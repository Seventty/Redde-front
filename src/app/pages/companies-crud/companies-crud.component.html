<h1 class="text-3xl font-bold mb-4">Listado de Empresas</h1>

<p-table [value]="companies" [columns]="headers" [tableStyle]="{ 'min-width': '80rem' }">
    <ng-template pTemplate="header" let-columns>
        <tr>
            <th *ngFor="let col of columns">{{ col.header }}</th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-rowData let-columns="columns" let-rowIndex="index">
        <tr>
            <td *ngFor="let col of columns">
                <ng-container *ngIf="col.field === 'options'">
                    <p-splitButton [model]="rowData.actions" class="p-button-text" icon="pi pi-cog" appendTo="body">
                    </p-splitButton>
                </ng-container>

                <ng-container *ngIf="col.field !== 'options'">
                    {{ getColumnValue(rowData, col.field) }}
                </ng-container>
            </td>
        </tr>
    </ng-template>
</p-table>

<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>
